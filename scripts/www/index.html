<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>苏米的秘密基地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F6F0FB;--card:#FFFFFF;--primary:#9E6BD8;--dark:#443A5C;
  --pink:#F084C0;--pinkl:#FDE4F3;--pinksoft:#F9A8D9;
  --lav:#EFE3FA;--lav2:#F1EAF9;--line:#EDE6F7;
  --yellow:#F5A623;--yellowl:#FFF4D6;--green:#5FBF83;--greenl:#E4F7EA;
  --blue:#7FA8EC;--bluel:#E3EEFC;--orange:#F5A05C;--orangel:#FFEBDD;
  --text:#3E3653;--sub:#9C94AE;--mute:#B9A8E0;--deeplav:#7A68A6;--mute2:#C9B8EC;
  --shadow:0 3px 10px rgba(158,120,216,.08);--shadow2:0 4px 12px rgba(158,120,216,.10);--shadow3:0 6px 16px rgba(158,120,216,.16);
}
html,body{height:100%}
body{font-family:'Noto Sans SC',sans-serif;background:#E5DBF2;display:flex;justify-content:center;color:var(--text);overflow:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none;background:transparent;color:inherit}
#app{display:flex;width:100%;max-width:430px;min-height:100dvh;background:var(--bg);position:relative}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.num{font-family:'Baloo 2',cursive}
.zcool{font-family:'ZCOOL KuaiLe',cursive;font-weight:400}
.svgi{display:inline-flex;flex:none}
.svgi svg{width:100%;height:100%;display:block}
/* ---------- 视图 ---------- */
#views{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.view{display:none;flex-direction:column;flex:1;overflow-y:auto;padding:16px 20px 14px;gap:12px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{display:flex}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow2);padding:12px}
.ic{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.spacer{flex:1}
.pilltag{padding:2px 6px;border-radius:8px;background:var(--yellowl);color:var(--yellow);font-size:9px;font-weight:500}
.barbg{height:10px;border-radius:5px;background:var(--lav2);overflow:hidden}
.barbg>div{height:100%;border-radius:5px;background:linear-gradient(90deg,#9E6BD8,#F084C0)}
.btn-primary{padding:8px 14px;border-radius:14px;background:var(--primary);color:#fff;font-size:11px;font-weight:700}
.btn-primary:active{transform:scale(.95)}
.btn-ghost{padding:6px 10px;border-radius:12px;background:var(--lav2);color:var(--sub);font-size:9px;font-weight:500}
.btn-go{padding:6px 10px;border-radius:12px;background:var(--primary);color:#fff;font-size:9px;font-weight:600}
.backbtn{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.backbtn .svgi{width:16px;height:16px;color:var(--text)}
.pagehead{display:flex;align-items:center;gap:10px}
.pagehead .titles{flex:1;min-width:0}
.pagehead h1{font-size:19px;color:var(--text)}
.pagehead .sub{font-size:10px;color:var(--sub);margin-top:2px}
.countpill{padding:6px 8px;border-radius:14px;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;flex:none;line-height:1}
.countpill .svgi{width:13px;height:13px}
.done-check{width:36px;height:36px;border-radius:50%;background:var(--greenl);display:flex;align-items:center;justify-content:center;flex:none}
.done-check .svgi{width:16px;height:16px;color:var(--green)}
/* ---------- 底部导航 ---------- */
#tabbar{flex:none;height:95px;padding:12px 21px 21px;display:flex}
#tabbar .pill{flex:1;height:62px;border-radius:36px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow3);display:flex;padding:4px}
.tab{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute)}
.tab .svgi{width:18px;height:18px}
.tab span{font-size:10px;font-weight:500;color:var(--sub)}
.tab.active{background:var(--primary)}
.tab.active .svgi{color:#fff}
.tab.active span{color:#fff}
/* ---------- 首页 ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between}
.home-user{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#FFF7EC;flex:none;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-edit{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 4px rgba(158,120,216,.3)}
.avatar-edit .svgi{width:10px;height:10px}
.home-name{display:flex;align-items:center;gap:6px}
.home-name h1{font-size:20px;color:var(--text)}
.home-name .svgi{width:12px;height:12px;color:var(--mute2)}
.home-date{font-size:11px;color:var(--sub);margin-top:3px}
.soundbtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(158,120,216,.18);display:flex;align-items:center;justify-content:center;flex:none}
.soundbtn .svgi{width:20px;height:20px;color:var(--primary)}
.soundbtn.off .svgi{color:var(--mute2)}
.stats-row{display:flex;gap:10px}
.stat-card{flex:1;background:#fff;border-radius:18px;box-shadow:var(--shadow2);padding:10px;display:flex;align-items:center;gap:8px}
.stat-card .ic{width:36px;height:36px}
.stat-card .ic .svgi{width:18px;height:18px}
.stat-card .lbl{font-size:10px;color:var(--sub)}
.stat-card .val{font-size:18px;font-weight:700;color:var(--text);line-height:1.1}
.reward-card{display:flex;flex-direction:column;gap:8px}
.reward-card .head{display:flex;align-items:center;gap:10px}
.reward-card .ic{width:40px;height:40px}
.reward-card .ic .svgi{width:20px;height:20px}
.reward-card .mini{font-size:10px;color:var(--sub)}
.reward-card .rname{font-size:14px;font-weight:700;color:var(--text)}
.reward-card .rnum{font-size:16px;font-weight:700;color:var(--primary)}
.reward-card .hint{font-size:10px;color:var(--sub)}
.sect-title{display:flex;align-items:center;gap:8px}
.sect-title .skullbox{width:24px;height:24px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;flex:none}
.sect-title .skullbox .svgi{width:14px;height:14px}
.sect-title h2{font-size:17px;color:var(--text)}
.sect-title .sub{font-size:10px;color:var(--sub)}
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.module{background:#fff;border-radius:20px;box-shadow:var(--shadow2);padding:12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left}
.module:active{transform:scale(.97)}
.module .ic{width:40px;height:40px}
.module .ic .svgi{width:22px;height:22px;color:#fff}
.module .mname{font-size:16px;color:var(--text)}
.module .msub{font-size:10px;color:var(--sub)}
.module .mmeta{font-size:10px;font-weight:500}
.module.dark{background:var(--dark)}
.module.dark .mname{color:#fff}
.module.dark .msub{color:#D9CBF2}
.module.dark .mmeta{color:var(--pinksoft)}
/* ---------- 任务卡 ---------- */
.taskcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:10px}
.taskcard .ic{width:42px;height:42px}
.taskcard .ic .svgi{width:21px;height:21px}
.taskcard .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.taskcard .namerow{display:flex;align-items:center;gap:6px}
.taskcard .tname{font-size:14px;font-weight:700;color:var(--text)}
.taskcard .tnote{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskcard .meta{display:flex;align-items:center;gap:6px}
.taskcard .meta .svgi{width:12px;height:12px;color:var(--sub)}
.taskcard .mtime{font-size:9px;color:var(--sub)}
.spkchip{width:22px;height:22px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center;flex:none}
.spkchip .svgi{width:11px;height:11px;color:var(--primary)}
.spkchip:active{transform:scale(.9)}
.spkchip.speaking{background:var(--primary)}
.spkchip.speaking .svgi{color:#fff;animation:spkpulse 1s ease-in-out infinite}
@keyframes spkpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.taskcard.done .tname{color:var(--sub);text-decoration:line-through}
.voice-hint{background:var(--lav);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px}
.voice-hint .svgi{width:16px;height:16px;color:var(--primary);flex:none}
.voice-hint p{font-size:10px;color:var(--deeplav)}
.agenda-sect{display:flex;align-items:center;gap:8px;margin-top:4px}
.agenda-sect .ic{width:30px;height:30px}
.agenda-sect .ic .svgi{width:15px;height:15px}
.agenda-sect h3{font-size:14px;color:var(--text);flex:1}
.agenda-sect .prog{font-size:9px;color:var(--sub)}
/* ---------- 打卡日历 / 周期策略 ---------- */
.weekstrip{display:flex;gap:5px;background:#fff;border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;border-radius:12px;transition:background .15s}
.wday .wn{font-size:9px;color:var(--sub);font-weight:500;line-height:1}
.wday .wd{font-size:14px;font-weight:700;color:var(--text);font-family:'Baloo 2',cursive;line-height:1}
.wday .wdot{width:5px;height:5px;border-radius:50%;background:var(--mute2)}
.wday.all .wdot{background:var(--green)}
.wday.part .wdot{background:var(--yellow)}
.wday.rest .wdot{background:transparent;box-shadow:inset 0 0 0 1.3px #E2D9F2}
.wday.today .wd{color:var(--primary)}
.wday.sel{background:var(--primary)}
.wday.sel .wn,.wday.sel .wd{color:#fff}
.wday.sel .wdot{background:#fff}
.wday.sel.rest .wdot{background:rgba(255,255,255,.5);box-shadow:none}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar .dtxt{font-size:12px;font-weight:700;color:var(--text)}
.daybar .dsub{font-size:9px;color:var(--sub);margin-top:2px}
.wkbtn{font-size:11px;font-weight:700;color:var(--primary);font-family:'Baloo 2',cursive;padding:6px 10px;border-radius:12px;background:var(--lav)}
.segbtn{display:flex;background:var(--lav2);border-radius:12px;padding:3px;flex:none}
.segbtn button{padding:5px 11px;border-radius:9px;font-size:10px;font-weight:600;color:var(--sub)}
.segbtn button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.rest-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.rest-card .ric{width:56px;height:56px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center}
.rest-card .ric .svgi{width:28px;height:28px;color:var(--primary)}
.rest-card .rt1{font-size:14px;color:var(--text)}
.rest-card .rt2{font-size:10px;color:var(--sub);line-height:1.7}
.rest-card .rt2 b{color:var(--primary)}
.schedtag{padding:2px 6px;border-radius:8px;background:var(--lav);color:var(--deeplav);font-size:9px;font-weight:500;display:inline-flex;align-items:center;gap:3px;flex:none;line-height:1.2}
.schedtag .svgi{width:9px;height:9px}
.streak-row{display:flex;gap:10px}
.streak-card{flex:1;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px;display:flex;align-items:center;gap:8px}
.streak-card .ic{width:32px;height:32px}
.streak-card .ic .svgi{width:16px;height:16px}
.streak-card .lbl{font-size:9px;color:var(--sub)}
.streak-card .val{font-size:16px;font-weight:700;color:var(--text);font-family:'Baloo 2',cursive;line-height:1.15}
/* 周期编辑器 */
.sched-chips{display:flex;flex-wrap:wrap;gap:8px}
.sched-chip{padding:9px 11px;border-radius:14px;background:#fff;font-size:11px;font-weight:500;color:var(--sub);border:1.5px solid transparent;display:flex;align-items:center;gap:5px}
.sched-chip .svgi{width:14px;height:14px}
.sched-chip.on{background:var(--lav);color:var(--primary);border-color:var(--primary);font-weight:700}
.sched-box{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sched-box .bh{font-size:10px;font-weight:600;color:var(--sub);line-height:1.5}
.daysel{display:flex;gap:5px}
.daysel button{flex:1;height:36px;border-radius:11px;background:var(--bg);font-size:11px;font-weight:600;color:var(--sub)}
.daysel button.on{background:var(--primary);color:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--lav);color:var(--primary);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.stepper b{font-family:'Baloo 2',cursive;font-size:16px;color:var(--text);min-width:64px;text-align:center}
.dateline{display:flex;align-items:center;gap:7px}
.dateline input{flex:1;min-width:0;background:var(--bg);border-radius:11px;padding:9px 10px;font-size:11px;color:var(--text);font-family:inherit}
.dateline .sep{font-size:10px;color:var(--mute2);flex:none}
.preset-row{display:flex;flex-wrap:wrap;gap:6px}
.preset{padding:7px 11px;border-radius:12px;background:var(--pinkl);color:var(--pink);font-size:10px;font-weight:600}
.preset.g{background:var(--greenl);color:var(--green)}
.preset.b{background:var(--bluel);color:var(--blue)}
.sched-preview{background:var(--lav);border-radius:14px;padding:11px;font-size:10px;color:var(--deeplav);line-height:1.7}
.sched-preview b{color:var(--primary)}
.sheet .schedrow{display:flex;align-items:center;gap:6px;background:var(--lav2);border-radius:11px;padding:8px 10px;width:100%;text-align:left}
.sheet .schedrow .svgi{width:12px;height:12px;color:var(--primary);flex:none}
.sheet .schedrow .stxt{flex:1;font-size:10px;font-weight:600;color:var(--deeplav);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .schedrow .arrow{width:11px;height:11px;color:var(--mute2)}
/* ---------- 萌萌之家 ---------- */
.pet-stage{position:relative;height:240px;border-radius:24px;background:linear-gradient(135deg,#B678E0,#F784AC);overflow:hidden;flex:none}
.pet-circle{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;border:4px solid #fff;overflow:hidden;background:#FFF0F5;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pet-circle svg{width:100%;height:100%;animation:breath 3.2s ease-in-out infinite;display:block}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.pet-circle.munch svg{animation:munch .5s ease 2}
@keyframes munch{50%{transform:scale(.92,1.05)}}
.pet-circle.wiggle svg{animation:wig .6s ease 2}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pet-circle.happy svg{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-10px)}}
/* 点兔子：Q 弹蹦跳（squash & stretch）+ 挥爪 + 抖耳 */
.pet-circle.boing svg{animation:boing .55s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes boing{0%{transform:scale(1,1)}25%{transform:scale(.88,1.12) translateY(-14px)}55%{transform:scale(1.08,.9) translateY(2px)}80%{transform:scale(.96,1.04) translateY(-4px)}100%{transform:scale(1,1)}}
.pet-circle.boing .b-paw-l{animation:pawwave .45s ease 2;transform-origin:70px 165px}
.pet-circle.boing .b-paw-r{animation:pawwave .45s ease 2 .08s;transform-origin:130px 165px}
@keyframes pawwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg) translateY(-6px)}}
.pet-circle.boing .b-ear-l{animation:earshake .45s ease 2;transform-origin:66px 88px}
.pet-circle.boing .b-ear-r{animation:earshake .45s ease 2 .05s;transform-origin:134px 88px}
@keyframes earshake{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}65%{transform:rotate(7deg)}}
/* 摸尾巴：害羞扭动 */
.pet-circle.shyshake svg{animation:shyshake .7s ease 2}
@keyframes shyshake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-5deg)}75%{transform:translateX(5px) rotate(5deg)}}
.pet-circle.shyshake .b-tail{animation:tailwag .35s ease 4;transform-origin:152px 152px}
@keyframes tailwag{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
/* 自主行为：常态抖耳朵（每 6s 一次） */
.pet-circle .b-ear-l{animation:eartwitch 6s ease-in-out infinite;transform-origin:66px 88px}
.pet-circle .b-ear-r{animation:eartwitch 6s ease-in-out infinite 3s;transform-origin:134px 88px}
@keyframes eartwitch{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-7deg)}94%{transform:rotate(4deg)}97%{transform:rotate(-2deg)}}
/* 自主行为：打瞌睡眨眼（豆豆眼每 4.5s 眨一次） */
.pet-circle .b-eye{animation:blink 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
/* 动画优先级：互动时覆盖常态 */
.pet-circle.boing .b-ear-l,.pet-circle.boing .b-ear-r{animation:earshake .45s ease 2}
/* 尾巴可点区域（透明热区，对应 SVG 尾巴圆心位置） */
.tail-zone{position:absolute;left:50%;margin-left:20px;top:130px;width:56px;height:56px;border-radius:50%;background:transparent;z-index:4;cursor:pointer}
.tail-zone:active{transform:scale(.92)}
/* 氛围：呼吸感标题浮动 */
.float-title{animation:titlefloat 3.6s ease-in-out infinite}
@keyframes titlefloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 氛围：对话气泡弹出动画 */
.mood-bubble{position:absolute;top:16px;right:20px;background:#fff;border-radius:14px;padding:8px 10px;font-size:10px;font-weight:500;color:var(--text);max-width:150px;z-index:5;box-shadow:0 4px 12px rgba(62,54,83,.15)}
.mood-bubble::after{content:'';position:absolute;left:24px;bottom:-5px;width:10px;height:10px;background:#fff;transform:rotate(45deg);border-radius:2px}
.mood-bubble.pop{animation:bubblepop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubblepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.stage-star{position:absolute;color:#FFD668}
.stage-star.s2{color:var(--pinksoft)}
.collar-badge{position:absolute;left:50%;top:186px;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:9px;font-weight:600;border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:4px;z-index:3}
.collar-badge .svgi{width:10px;height:10px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fx-bone{position:absolute;left:50%;top:-30px;margin-left:-14px;animation:fall 1.2s ease-in forwards;color:#FFF4D6}
@keyframes fall{70%{opacity:1}100%{transform:translateY(160px) rotate(40deg);opacity:0}}
.fx-heart{position:absolute;bottom:60px;animation:rise 1.4s ease-out forwards;color:#FFD3EA}
@keyframes rise{100%{transform:translateY(-130px) scale(1.4);opacity:0}}
.fx-ball{position:absolute;bottom:30px;left:20px;animation:bounceball 1.6s ease forwards;color:#fff}
@keyframes bounceball{0%{transform:translate(0,0)}25%{transform:translate(80px,-60px)}50%{transform:translate(160px,0)}75%{transform:translate(240px,-45px)}100%{transform:translate(300px,0);opacity:0}}
.fx-shower{position:absolute;top:8px;left:50%;margin-left:-70px;animation:showerin .4s ease forwards;color:#fff}
@keyframes showerin{from{transform:translateY(-60px)}to{transform:translateY(0)}}
.fx-drop{position:absolute;top:60px;width:4px;height:10px;border-radius:2px;background:rgba(255,255,255,.9);animation:drop .9s linear forwards}
@keyframes drop{100%{transform:translateY(150px);opacity:0}}
.fx-bubble{position:absolute;bottom:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:bubrise 1.8s ease-out forwards}
@keyframes bubrise{100%{transform:translateY(-160px) scale(1.3);opacity:0}}
.fx-cross{position:absolute;left:50%;top:70px;transform:translateX(-50%);animation:crossfade 1.4s ease forwards;color:#E4F7EA}
@keyframes crossfade{0%{opacity:0;transform:translateX(-50%) scale(.5)}30%{opacity:1;transform:translateX(-50%) scale(1.1)}100%{opacity:0;transform:translateX(-50%) scale(1.2)}}
.pet-stats{display:flex;gap:10px}
.pstat{flex:1;background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px}
.pstat .lbl{font-size:9px;font-weight:500;color:var(--sub)}
.pstat .pbar{height:6px;border-radius:3px;background:var(--lav2);overflow:hidden}
.pstat .pbar>div{height:100%;border-radius:3px}
.pet-actions{display:flex;gap:10px}
.pact{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.pact .circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.pact .circle .svgi{width:24px;height:24px}
.pact:active .circle{transform:scale(.88)}
.pact span{font-size:10px;font-weight:500;color:var(--text)}
.scene-note{font-size:9px;color:var(--sub);text-align:center}
.shop-head{display:flex;align-items:center;justify-content:space-between}
.shop-head h2{font-size:15px;color:var(--text)}
.shop-head .sub{font-size:9px;color:var(--sub)}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.shop-item{background:#fff;border-radius:18px;padding:10px;display:flex;align-items:center;gap:8px}
.shop-item .ic{width:36px;height:36px}
.shop-item .ic .svgi{width:18px;height:18px}
.shop-item .info{flex:1;min-width:0}
.shop-item .sname{font-size:11px;font-weight:700;color:var(--text)}
.shop-item .sprice{font-size:9px;font-weight:500;color:var(--pink);margin-top:2px}
.shop-item .buy{padding:6px 10px;border-radius:12px;background:var(--primary);color:#fff;font-size:9px;font-weight:700}
.shop-item .buy:disabled{background:var(--lav2);color:var(--sub)}
/* ---------- 奖励 ---------- */
.reward-row{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:10px}
.reward-row .ic{width:42px;height:42px}
.reward-row .ic .svgi{width:21px;height:21px}
.reward-row .info{flex:1;min-width:0}
.reward-row .rname{font-size:13px;font-weight:700;color:var(--text)}
.reward-row .rcost{font-size:9px;color:var(--sub);margin-top:2px}
.custom-card{background:#fff;border:1.5px dashed #D9CBF2;border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:none}
.custom-card .svgi{width:16px;height:16px;color:var(--mute)}
.custom-card .t1{font-size:11px;font-weight:500;color:var(--sub)}
.custom-card .t2{font-size:9px;color:var(--mute2)}
/* ---------- 家长验证 ---------- */
#view-lock{align-items:center;justify-content:center;gap:14px;padding:0 24px}
.lock-emblem{width:88px;height:88px;border-radius:50%;background:linear-gradient(180deg,#6B5A96,#443A5C);display:flex;align-items:center;justify-content:center}
.lock-emblem .svgi{width:40px;height:40px}
.lock-title{font-size:22px;color:var(--text)}
.lock-desc{font-size:11px;color:var(--sub);text-align:center}
.lock-card{width:100%;background:#fff;border-radius:20px;box-shadow:0 5px 14px rgba(158,120,216,.12);padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.lock-card .mini{font-size:10px;color:var(--sub)}
.lock-q{font-size:32px;font-weight:800;color:var(--text);letter-spacing:2px}
.lock-opts{display:flex;gap:10px;width:100%}
.lock-opt{flex:1;padding:10px 0;border-radius:14px;background:var(--bg);font-size:16px;font-weight:700;color:var(--text);text-align:center;font-family:'Baloo 2',cursive}
.lock-opt:active{transform:scale(.94)}
.lock-opt.right{background:var(--lav);color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.lock-opt.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lock-hint{font-size:9px;color:var(--mute2)}
.lock-note{width:100%;background:var(--lav);border-radius:14px;padding:12px;font-size:9px;color:var(--deeplav);text-align:center;line-height:1.6}
/* ---------- 家长设置 ---------- */
.set-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.set-card h2{font-size:14px;color:var(--text)}
.set-card .lbl{font-size:10px;color:var(--sub)}
.name-input{background:var(--bg);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.name-input input{flex:1;font-size:12px;font-weight:500;color:var(--text);min-width:0}
.name-input .svgi{width:12px;height:12px;color:var(--mute2);flex:none}
.set-row{display:flex;align-items:center;gap:10px}
.set-row .txt{flex:1;min-width:0}
.set-row .rname{font-size:12px;font-weight:500;color:var(--text)}
.set-row .rsub{font-size:9px;color:var(--sub);margin-top:2px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--primary);position:relative;flex:none;transition:background .2s}
.toggle::after{content:'';position:absolute;top:2px;left:20px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.off{background:#E5DDF2}
.toggle.off::after{left:2px}
.cfg-row{display:flex;align-items:center;gap:10px}
.cfg-row .ic{width:30px;height:30px}
.cfg-row .ic .svgi{width:14px;height:14px}
.cfg-row .rname{flex:1;font-size:12px;font-weight:500;color:var(--text)}
.cfg-row .cfg{font-size:10px;font-weight:500;color:var(--primary)}
.cfg-row .svgi.arrow{width:10px;height:10px;color:var(--mute2)}
/* ---------- 语音引擎面板 ---------- */
.voice-status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg);margin-top:4px}
.voice-status .dot{width:10px;height:10px;border-radius:50%;flex:none}
.voice-status .dot.ok{background:var(--green);box-shadow:0 0 0 4px rgba(95,191,131,.18);animation:dotpulse 1.8s ease infinite}
.voice-status .dot.warn{background:var(--yellow);box-shadow:0 0 0 4px rgba(245,166,35,.18)}
.voice-status .dot.bad{background:#E96B6B;box-shadow:0 0 0 4px rgba(233,107,107,.18)}
@keyframes dotpulse{0%,100%{box-shadow:0 0 0 4px rgba(95,191,131,.18)}50%{box-shadow:0 0 0 8px rgba(95,191,131,0)}}
.voice-status .txt{flex:1;min-width:0}
.voice-status .l1{font-size:12px;font-weight:600;color:var(--text)}
.voice-status .l2{font-size:9px;color:var(--sub);margin-top:2px}
.voice-status .ic{width:34px;height:34px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center;flex:none;color:var(--primary)}
.voice-status .ic .svgi{width:16px;height:16px}
.voice-mode-pill{padding:4px 10px;border-radius:10px;background:var(--primary);color:#fff;font-size:10px;font-weight:600}
.voice-mode-pill.sub{background:var(--pink)}
.voice-mode-pill.auto{background:var(--yellow)}
.voice-tuner{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.voice-tuner .row2{display:flex;align-items:center;gap:10px}
.voice-tuner .row2 label{flex:1;font-size:11px;color:var(--sub);font-weight:500}
.voice-tuner .row2 .v{font-size:12px;font-weight:700;color:var(--primary);width:46px;text-align:right;font-family:'Baloo 2',cursive}
.voice-tuner input[type=range]{flex:2;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--lav2);outline:none}
.voice-tuner input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(158,107,216,.35)}
.voice-tuner input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:none}
.voice-choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.voice-choice{padding:6px 10px;border-radius:12px;background:var(--lav2);color:var(--text);font-size:10px;font-weight:500}
.voice-choice.on{background:var(--primary);color:#fff}
.unlocked-pill{padding:6px;border-radius:12px;background:var(--greenl);color:var(--green);font-size:9px;font-weight:500}
/* ---------- 弹层/提示 ---------- */
#modal-mask{position:fixed;inset:0;background:rgba(62,54,83,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal-mask.show{display:flex}
.sheet{width:100%;max-width:430px;max-height:82dvh;background:var(--bg);border-radius:24px 24px 0 0;padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;animation:sheetin .25s ease}
@keyframes sheetin{from{transform:translateY(60px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet h3{font-size:16px;color:var(--text)}
.sheet .f-row{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:14px;padding:10px}
.sheet .f-row .fh{display:flex;align-items:center;gap:6px}
.sheet .f-row .fh .fidx{width:18px;height:18px;border-radius:9px;background:var(--lav);color:var(--primary);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sheet input.field{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--text);width:100%}
.sheet .f-2col{display:flex;gap:8px}
.sheet .f-2col>*{flex:1;min-width:0}
.sheet .savebtn{background:var(--primary);color:#fff;border-radius:14px;padding:12px;font-size:13px;font-weight:700;text-align:center}
.sheet .delbtn{color:#F0768C;font-size:10px;flex:none;padding:4px 6px}
.sheet .addbtn{border:1.5px dashed #D9CBF2;border-radius:14px;padding:10px;font-size:11px;color:var(--primary);font-weight:500;text-align:center;width:100%}
/* ---------- 头像选择 ---------- */
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px}
.avatar-opt{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff;border:2.5px solid transparent;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;padding:0}
.avatar-opt:active{transform:scale(.95)}
.avatar-opt.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--lav)}
.avatar-opt img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-opt .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(255,255,255,.92));font-size:9px;text-align:center;color:var(--text);padding:6px 0 3px;font-weight:600}
.avatar-opt .chk{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;display:none;align-items:center;justify-content:center}
.avatar-opt .svgi{width:11px;height:11px}
.avatar-opt.selected .chk{display:flex}
.avatar-tip{background:var(--lav);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px}
.avatar-tip .svgi{width:16px;height:16px;color:var(--primary);flex:none}
.avatar-tip p{font-size:10px;color:var(--deeplav);line-height:1.4}
.avatar-loading{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:10px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;font-size:11px;padding:10px 18px;border-radius:20px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 字幕模式（语音回退） ---------- */
#subtitle{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none}
#subtitle.show{display:flex}
#subtitle .sub-box{position:relative;background:linear-gradient(135deg,rgba(158,107,216,.95),rgba(240,132,192,.95));color:#fff;border-radius:20px;padding:18px 22px;max-width:80%;min-width:260px;box-shadow:0 14px 32px rgba(62,54,83,.35);animation:subpop .35s cubic-bezier(.22,1.5,.5,1);pointer-events:auto}
@keyframes subpop{from{transform:translateY(20px) scale(.85);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
#subtitle .sub-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:#fff}
#subtitle .sub-icon .svgi{width:18px;height:18px}
#subtitle .sub-icon{animation:subpulse 1.6s ease-in-out infinite}
@keyframes subpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#subtitle .sub-close{position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center}
#subtitle .sub-text{font-size:18px;line-height:1.55;font-weight:600;letter-spacing:1px;word-break:break-word;background:linear-gradient(90deg,#fff var(--p,100%),rgba(255,255,255,.55) var(--p,100%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;min-height:54px}
#subtitle .sub-meta{font-size:9px;color:rgba(255,255,255,.8);margin-top:6px;text-align:right;font-family:'Baloo 2',cursive}
#subtitle .sub-progress{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:6px;overflow:hidden}
#subtitle .sub-progress>div{height:100%;background:#fff;border-radius:2px;transition:width .15s}
.confetti{position:fixed;pointer-events:none;z-index:98;animation:conf .9s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
/* ---------- 平板端（讯飞 T90 Pro 横屏） ---------- */
#sidebar{display:none;width:230px;flex:none;background:#fff;flex-direction:column;padding:20px;gap:6px;overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.side-logo .avatar{width:44px;height:44px}
.side-logo .n1{font-size:15px;color:var(--text)}
.side-logo .n2{font-size:9px;color:var(--sub);margin-top:2px}
.side-nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--mute);text-align:left;width:100%}
.side-nav .svgi{width:18px;height:18px}
.side-nav span{font-size:12px;font-weight:500;color:#6B6480}
.side-nav.active{background:var(--primary)}
.side-nav.active .svgi{color:#fff}
.side-nav.active span{color:#fff;font-weight:700}
.home-extra{display:none;gap:14px}
.extra-card{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.extra-card h3{font-size:14px;color:var(--text)}
.todo-row{display:flex;align-items:center;gap:8px}
.todo-row .todo-dot{width:20px;height:20px;border-radius:50%;border:2px solid #D9CBF2;flex:none}
.todo-row.done .todo-dot{border:none;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff}
.todo-row .tname{flex:1;font-size:11px;font-weight:500;color:var(--text)}
.todo-row.done .tname{color:var(--sub)}
.todo-row .ttime{font-size:9px;color:var(--sub)}
.todo-row.done .ttime{color:var(--green)}
.maomao-card{background:linear-gradient(135deg,#F084C0,#FAA8D9);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.maomao-card .hd{display:flex;align-items:center;gap:10px}
.maomao-card .ic{width:40px;height:40px;background:#fff}
.maomao-card .ic .svgi{width:20px;height:20px;color:var(--pink)}
.maomao-card h3{font-size:14px;color:#fff}
.maomao-card .sub{font-size:9px;color:#FFF0F8;margin-top:2px}
.maomao-card .go{background:#fff;color:var(--pink);border-radius:12px;padding:10px;font-size:10px;font-weight:700;text-align:center}
@media(min-width:900px){
  #app{max-width:1280px}
  #sidebar{display:flex}
  #tabbar{display:none}
  .module-grid{grid-template-columns:repeat(3,1fr);gap:14px}
  .module{flex-direction:row;align-items:center;gap:12px;padding:16px}
  .module .ic{width:48px;height:48px}
  .module .ic .svgi{width:24px;height:24px}
  .module .mtexts{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .module .mname{font-size:15px}
  .home-extra{display:flex}
  .sheet{max-width:560px;border-radius:24px;margin-bottom:40px}
  #modal-mask{align-items:center}
  .avatar-grid{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <div id="views">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-subject"></section>
      <section class="view" id="view-agenda"></section>
      <section class="view" id="view-pet"></section>
      <section class="view" id="view-rewards"></section>
      <section class="view" id="view-lock"></section>
      <section class="view" id="view-settings"></section>
    </div>
    <nav id="tabbar"></nav>
  </div>
</div>
<div id="modal-mask"></div>
<div id="toast"></div>
<div id="subtitle"></div>

<script>
/* ==================== 图标库（还原设计稿 SVG） ==================== */
const ICONS={

skullP:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.5 2 2 6.3 2 11.6c0 3.1 1.5 5.8 3.9 7.4V22h12.2v-3C20.5 17.4 22 14.7 22 11.6 22 6.3 17.5 2 12 2z" fill="#9E6BD8"/><circle cx="8.2" cy="11" r="1.9" fill="#FFFFFF"/><circle cx="15.8" cy="11" r="1.9" fill="#FFFFFF"/><path d="M12 14.2l-1.3 2h2.6l-1.3-2z" fill="#FFFFFF"/></svg>',

   每个任务带一个 sched 对象，决定「哪些天需要打卡」：
     type: daily 每天 | workday 工作日 | weekend 周末 | weekly 每周指定几天

     days:[0-6]   weekly 用（0=周日）

const WEEK_CN=['日','一','二','三','四','五','六'];
const WEEK_ORDER=[1,2,3,4,5,6,0];
const SCHED_TYPES=[
  {id:'daily',   name:'每天',     icon:'cal',      hint:'每天都要打卡，最常用'},
  {id:'workday', name:'工作日',   icon:'briefcase',hint:'周一到周五打卡，周末休息'},
  {id:'weekend', name:'周末',     icon:'sun',      hint:'只在周六、周日打卡'},
  {id:'weekly',  name:'每周指定', icon:'calCheck', hint:'自己挑一周里的哪几天打卡'},
  {id:'interval',name:'隔天',     icon:'repeat',   hint:'每隔 N 天打卡一次'},
  {id:'monthly', name:'每月指定', icon:'calRange', hint:'每月固定几号打卡'},

const SCHED_DEFAULT={type:'daily',days:[1,2,3,4,5],every:2,anchor:'',monthDays:[1],start:'',end:''};
function schedOf(t){return Object.assign({},SCHED_DEFAULT,(t&&t.sched)||{})}

function dkey(d){d=d||new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(k){const p=String(k).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmtMD(d){return `${d.getMonth()+1}月${d.getDate()}日`}

/* 某任务在某天是否需要打卡 */
function schedMatch(t,day){
  const s=schedOf(t),k=dkey(day);
  if(s.start&&k<s.start)return false;
  if(s.end&&k>s.end)return false;
  const dow=day.getDay();
  switch(s.type){
    case 'daily':return true;
    case 'range':return !!(s.start&&s.end);
    case 'workday':return dow>=1&&dow<=5;
    case 'weekend':return dow===0||dow===6;
    case 'weekly':return (s.days||[]).includes(dow);
    case 'interval':{
      const a=s.anchor||s.start||k;
      const diff=Math.round((new Date(day.getFullYear(),day.getMonth(),day.getDate())-parseDay(a))/86400000);
      return diff>=0&&diff%(s.every||2)===0;
    }
    case 'monthly':return (s.monthDays||[]).includes(day.getDate());
  }
  return true;
}
/* 周期文字说明 */
function schedText(s){
  s=Object.assign({},SCHED_DEFAULT,s||{});
  let base='每天';
  if(s.type==='workday')base='工作日';
  else if(s.type==='weekend')base='周末';
  else if(s.type==='weekly'){const ds=(s.days||[]).slice().sort((a,b)=>a-b);base=ds.length?'每周'+ds.map(i=>WEEK_CN[i]).join(''):'每周未选'}
  else if(s.type==='interval')base=`隔${s.every||2}天`;
  else if(s.type==='monthly')base='每月'+((s.monthDays||[]).join('、')||'1')+'号';
  else if(s.type==='range')base='日期内每天';
  const short=k=>k.slice(5).replace('-','/');
  if(s.start&&s.end)base+=`（${short(s.start)}–${short(s.end)}）`;
  else if(s.start)base+=`（${short(s.start)}起）`;
  else if(s.end)base+=`（至${short(s.end)}）`;
  return base;
}

/* 下一次需要打卡的日子；null 表示周期已结束 */
function nextActiveDay(t,from){

function setDone(t,v,day){const k=t.id+'@'+dkey(day||new Date());if(v)state.logs[k]=1;else delete state.logs[k]}

/* 连续打卡天数 */
function streakDays(){
  let n=0,d=new Date();
  for(let i=0;i<400;i++){
    const l=activeTasksOn(d,'sched');
    if(l.length&&l.every(t=>isDone(t,d)))n++;

function weekDays(base){

      },5000);
      a.onplaying=()=>{started=true;clearTimeout(startTimer)};
      a.onended=()=>{if(settled)return;settled=true;resolve(true)};
      a.onerror=()=>{clearTimeout(startTimer);if(settled)return;settled=true;if(!started)_ttsBadEndpoint[ep.id]=true;resolve(false)};
      a.src=ep.build(text);
      const p=a.play();if(p&&p.catch)p.catch(()=>{clearTimeout(startTimer);if(settled)return;settled=true;_ttsBadEndpoint[ep.id]=true;tryNext()});
    };
    tryNext();
  });
}

/* ---------- 第二级：设备 TTS（带 onstart 看门狗，防假阳性） ---------- */
let _voices=[],_voicesLoaded=false,_voicesTimer=null,_bestVoice=null,_warm=false,_ttsBusy=false;
function _loadVoices(){
  if(!('speechSynthesis' in window))return;
  _voices=speechSynthesis.getVoices()||[];
  _voicesLoaded=_voices.length>0;
  if(_voicesLoaded){clearTimeout(_voicesTimer);pickBestVoice()}
}
function pickBestVoice(){
  const pref=['Microsoft Xiaoxiao','Microsoft Yaoyao','Microsoft Huihui','Tingting','Mei-Jia','Sin-ji','Google 普通话','Google 中文','zh-CN','cmn-Hans-CN'];
  let best=null,bestScore=-1;
  for(const v of _voices){
    if(!v.lang||!/^zh|cmn/i.test(v.lang))continue;
    let score=1;
    if(v.localService)score+=5;
    if(/female|woman|女|xiaoxiao|yaoyao|huihui|meiling|tingting/i.test(v.name))score+=4;
    if(/microsoft/i.test(v.name))score+=3;
    if(/google/i.test(v.name))score+=2;
    for(let i=0;i<pref.length;i++)if(v.name.includes(pref[i])||v.voiceURI.includes(pref[i])){score+=3;break}
    if(score>bestScore){bestScore=score;best=v}
  }
  _bestVoice=best;
}
if('speechSynthesis' in window){
  _loadVoices();
  speechSynthesis.onvoiceschanged=_loadVoices;
  _voicesTimer=setTimeout(_loadVoices,1000);
}
function _warmup(){
  if(_warm||!('speechSynthesis' in window))return;
  _warm=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='zh-CN';speechSynthesis.speak(u)}catch(e){}
}
document.addEventListener('touchstart',_warmup,{passive:true,capture:true});
document.addEventListener('mousedown',_warmup,{capture:true});

function speakTTS(text){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){resolve(false);return}
    try{
      speechSynthesis.cancel();
      const parts=splitSpeakText(text,140);
      let i=0,resolved=false;
      const fail=()=>{if(resolved)return;resolved=true;try{speechSynthesis.cancel()}catch(e){};resolve(false)};
      const succeed=()=>{if(resolved)return;resolved=true;resolve(true)};
      const play=()=>{
        if(i>=parts.length){succeed();return}
        const u=new SpeechSynthesisUtterance(parts[i]);
        u.lang='zh-CN';
        u.rate=Math.max(.7,Math.min(1.4,state.voice.rate||1));
        u.pitch=Math.max(.7,Math.min(1.4,state.voice.pitch||1.05));
        u.volume=Math.max(0,Math.min(1,state.voice.volume??1));
        if(_bestVoice){u.voice=_bestVoice;u.lang=_bestVoice.lang||'zh-CN'}
        let started=false;
        u.onstart=()=>{started=true};
        u.onend=()=>{i++;play()};
        u.onerror=()=>fail();
        // onstart 看门狗：2.5s 内没真开播 → 判定本机语音假阳性，降级
        setTimeout(()=>{if(!started&&!resolved)fail()},2500);
        setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){fail()}},60);
      };
      play();
      // 防挂起：播放 10s 后 pause+resume 一次
      const keepAlive=setInterval(()=>{
        if(resolved){clearInterval(keepAlive);return}
        try{if(speechSynthesis.speaking){speechSynthesis.pause();speechSynthesis.resume()}}catch(e){}
      },10000);
      setTimeout(()=>{clearInterval(keepAlive);if(!resolved)fail()},Math.max(15000,text.length*350));
    }catch(e){resolve(false)}
  });
}
function splitSpeakText(t,max){
  if(t.length<=max)return [t];
  const out=[];let buf='';
  for(const ch of t){
    buf+=ch;
    if(/[。！？!?；;]/.test(ch)&&buf.length>=40){out.push(buf);buf=''}
    else if(buf.length>=max){out.push(buf);buf=''}
  }
  if(buf)out.push(buf);
  return out;
}

let petExprTimer=null,petExprHold=0;
function startPetExpr(){
  if(petExprTimer)clearInterval(petExprTimer);
  petExprTimer=setInterval(()=>{
    if(current.view!=='pet')return;
    if(Date.now()<petExprHold)return;
    const a=PET_EXPR_ROTATE[state.petIdx%PET_EXPR_ROTATE.length];
    state.petIdx++;
    setPetExpression(a.exp);
    petCircle(a.act);
    setMood(a.text);
    save();
  },4000);
}
function pokePetExpr(ms){petExprHold=Date.now()+(ms||6000)}

function petAct(kind){

    const s=document.createElement('span');s.className='fx-shower svgi';s.style.width='44px';s.style.height='44px';s.innerHTML=ICONS.shower;fx.appendChild(s);
    for(let i=0;i<10;i++){const d=document.createElement('div');d.className='fx-drop';d.style.left=(38+Math.random()*24)+'%';d.style.animationDelay=(0.3+Math.random()*0.8)+'s';fx.appendChild(d);setTimeout(()=>d.remove(),2200)}
    for(let i=0;i<6;i++){const b=document.createElement('div');b.className='fx-bubble';const sz=10+Math.random()*16;b.style.width=sz+'px';b.style.height=sz+'px';b.style.left=(20+Math.random()*60)+'%';b.style.animationDelay=(Math.random()*0.8)+'s';fx.appendChild(b);setTimeout(()=>b.remove(),2600)}
    setTimeout(()=>s.remove(),2200);
    petCircle('wiggle');bumpPet('health',3);bumpPet('mood',2);setMood('冲呀冲呀，洗香香～');render();setTimeout(()=>toast('萌萌洗得香香的，健康值 +3'),300);
  }else{
    const c=document.createElement('span');c.className='fx-cross svgi';c.style.width='48px';c.style.height='48px';c.innerHTML=ICONS.med;fx.appendChild(c);setTimeout(()=>c.remove(),1500);
    petCircle('happy');bumpPet('health',5);setMood('萌萌感觉好多了！');render();setTimeout(()=>toast('萌萌恢复健康，健康值 +5'),300);
  }
}
function buyItem(id){
  const it=state.shop.find(x=>x.id===id);
  if(!it||state.bones<it.cost)return;
  if(it.stat==='collar'&&state.collar)return;
  state.bones-=it.cost;
  if(it.stat==='collar'){state.collar=true;setMood('萌萌戴上新项圈啦！')}
  else{bumpPet(it.stat,it.val);setMood(it.desc+'！')}
  save();sndRedeem();toast(`兑换成功：${it.name}，${it.desc}！`);
  if(it.stat==='satiety')petAct('feed');else if(it.stat==='mood')petAct('play');else if(it.stat==='health')petAct('bathe');
  render();
}

let quiz={a:0,b:0,sum:0,opts:[]};
function newQuestion(){
  quiz.a=3+Math.floor(Math.random()*8);quiz.b=3+Math.floor(Math.random()*8);
  quiz.sum=quiz.a+quiz.b;
  const set=new Set([quiz.sum]);
  while(set.size<4){const v=quiz.sum+Math.floor(Math.random()*7)-3;if(v>0&&!set.has(v))set.add(v)}
  quiz.opts=[...set].sort(()=>Math.random()-0.5);
}

function answer(btn,v){

  clearArmed=0;state.logs={};save();toast('打卡记录已清空，积分和骨头都保留');render();
}
function renameApp(v){v=v.trim();if(!v)return;state.name=v;save();toast('工作台名字已修改');render()}
function toggleSound(k){state.sound[k]=!state.sound[k];save();sndClick();
  if(k==='music')toast(state.sound.music?'背景音乐已开启':'背景音乐已关闭');
  render()}
/* ---------- 语音引擎面板 ---------- */
function voiceSupport(){
  if(!('speechSynthesis' in window))return {ok:false,reason:'当前浏览器不支持语音合成 API'};
  if(!_voicesLoaded){
    _loadVoices();
    if(!_voicesLoaded)return {ok:false,reason:'正在加载本机语音库，请稍候再试'};
  }
  const zh=_voices.filter(v=>v.lang&&/^zh|cmn/i.test(v.lang));
  if(zh.length===0)return {ok:false,reason:'本机未安装中文语音，请到系统设置里添加'};
  return {ok:true,reason:`已识别 ${zh.length} 个中文语音${_bestVoice?` · 当前：${_bestVoice.name}`:''}`};
}
function voiceModeHint(){
  const m=state.voice.mode;
  if(m==='auto')return '自动：先在线语音，再本机语音，最后字幕';
  if(m==='online')return '仅在线语音：联网播放，失败显示字幕';
  if(m==='device')return '仅本机语音：不联网，失败显示字幕';
  if(m==='subtitle')return '仅字幕：永远不发出声音';
  return '';
}
function voiceModePill(){
  const m=state.voice.mode;
  const map={auto:['自动','auto'],online:['在线',''],device:['本机',''],subtitle:['字幕','sub']};
  const v=map[m]||['自动','auto'];
  return `<span class="voice-mode-pill ${v[1]}">${v[0]}</span>`;
}
function voiceEngineStatus(){
  const online=navigator.onLine;
  const dev=voiceSupport();
  const eps=getEndpoints();
  const epNames=eps.map(e=>e.name).join(' / ')||'无可用端点';
  let cls,l1,l2;
  if(online&&eps.length){cls='ok';l1='在线语音就绪';l2=`端点：${epNames}`}
  else if(online&&!eps.length){cls='warn';l1='端点均被标记不可用';l2='点试听重试，或切换端点'}
  else if(!online){cls=dev.ok?'warn':'bad';l1='当前离线';l2=dev.ok?'将使用本机语音':'本机语音也不可用，将显示字幕'}
  if(cls==='ok'&&dev.ok)l2+=` · 本机备用：${_bestVoice?_bestVoice.name:'中文语音'}`;
  return `<div class="voice-status">
    <span class="dot ${cls}"></span>
    <div class="txt">
      <div class="l1">${l1}</div>
      <div class="l2">${l2}</div>
    </div>
    ${voiceModePill()}
  </div>`;
}
function cycleVoiceMode(){
  const seq=['auto','online','device','subtitle'];
  const i=seq.indexOf(state.voice.mode);
  state.voice.mode=seq[(i+1)%seq.length];
  save();sndClick();toast('播报方式：'+voiceModeHint());render();
}
function setEndpoint(ep){
  state.voice.endpoint=ep;_ttsBadEndpoint={};save();sndClick();openVoiceTune();
}
function setCustomUrl(v){state.voice.customUrl=v.trim();save()}
function openVoiceTune(){
  const zh=_voices.filter(v=>v.lang&&/^zh|cmn/i.test(v.lang));
  const devChoices=zh.length?zh.map(v=>`<button class="voice-choice ${v.voiceURI===state.voice.voiceURI?'on':''}" onclick="setVoiceURI('${v.voiceURI.replace(/'/g,"\\'")}')">${v.name.replace(/</g,'&lt;')}</button>`).join(''):'<span style="font-size:10px;color:var(--sub)">本机未安装可用的中文语音</span>';
  const curEp=state.voice.endpoint||'auto';
  const epChoices=[{id:'auto',name:'自动轮换'},...TTS_ENDPOINTS.map(e=>({id:e.id,name:e.name})),{id:'custom',name:'自定义接口'}]
    .map(e=>`<button class="voice-choice ${curEp===e.id?'on':''}" onclick="setEndpoint('${e.id}')">${e.name}</button>`).join('');
  openModal(`
    <h3 class="zcool">语音调节</h3>
    <h4 style="font-size:11px;color:var(--sub);margin-top:4px;font-weight:500">在线语音接口（联网使用，音质最好）</h4>
    <div class="voice-choices">${epChoices}</div>
    ${curEp==='custom'?`<input class="field" style="margin-top:8px" placeholder="填入接口地址，用 {text} 代表文本" value="${(state.voice.customUrl||'').replace(/"/g,'&quot;')}" onchange="setCustomUrl(this.value)">`:''}
    <div class="voice-tuner">
      <div class="row2"><label>语速</label><input type="range" min="0.7" max="1.4" step="0.05" value="${state.voice.rate}" oninput="setVoiceRate(this.value)"><span class="v">${state.voice.rate.toFixed(2)}x</span></div>
      <div class="row2"><label>音调（仅本机）</label><input type="range" min="0.7" max="1.4" step="0.05" value="${state.voice.pitch}" oninput="setVoicePitch(this.value)"><span class="v">${state.voice.pitch.toFixed(2)}x</span></div>
      <div class="row2"><label>音量</label><input type="range" min="0" max="1" step="0.05" value="${state.voice.volume??1}" oninput="setVoiceVolume(this.value)"><span class="v">${Math.round((state.voice.volume??1)*100)}%</span></div>
    </div>
    <h4 style="font-size:11px;color:var(--sub);margin-top:14px;font-weight:500">本机备用声音（离线时使用）</h4>
    <div class="voice-choices">${devChoices}</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-ghost" style="flex:1" onclick="closeModal()">关闭</button>
      <button class="btn-go" style="flex:1" onclick="closeModal();testVoice()">试听</button>
    </div>`);
}
function setVoiceURI(uri){
  state.voice.voiceURI=uri;save();openVoiceTune();
}
function setVoiceRate(v){state.voice.rate=parseFloat(v);save();openVoiceTune()}
function setVoicePitch(v){state.voice.pitch=parseFloat(v);save();openVoiceTune()}
function setVoiceVolume(v){state.voice.volume=parseFloat(v);save();openVoiceTune()}
function testVoice(){
  const text='我是酷洛米，今天我们来打卡练字吧，记得坐端正，一笔一画慢慢写，加油哦！';
  closeModal();
  _ttsBadEndpoint={}; // 试听时清空端点黑名单，重新尝试
  toast('正在加载语音…');
  speak(text);
}

/* ---------- 头像选择弹层 ---------- */
function openAvatarPicker(){
  const cur=state.avatar.id;
  openModal(`
    <h3 class="zcool">选择你的头像</h3>
    <div class="avatar-tip">${svgi('star')}<p>点一个喜欢的头像，酷洛米会记住哒～ </p></div>
    <div class="avatar-grid" id="avatar-grid">
      ${AVATAR_PRESETS.map(a=>`
        <button class="avatar-opt ${a.id===cur?'selected':''}" data-id="${a.id}" data-name="${a.name}">
          <img src="${a.url}" alt="${a.name}" loading="lazy">
          <span class="lbl">${a.name}</span>
          <span class="chk">${svgi('check')}</span>
        </button>`).join('')}
    </div>
    <div class="avatar-tip">${svgi('heart')}<p>提示：当前头像 <b>${state.avatar.name}</b>，选好后点空白处即可关闭</p></div>
  `);
  setTimeout(()=>{
    document.querySelectorAll('.avatar-opt').forEach(btn=>{
      btn.onclick=()=>{
        const id=btn.dataset.id;
        const a=AVATAR_PRESETS.find(x=>x.id===id);
        if(!a)return;
        state.avatar={id:a.id,name:a.name};
        save();sndClick();
        toast('已切换头像：'+a.name);
        document.querySelectorAll('.avatar-opt').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));
        render();
      };
    });
  },50);
}
function openModal(html){const m=$('#modal-mask');m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.add('show');
  m.onclick=(e)=>{if(e.target===m)closeModal()}}
function closeModal(){$('#modal-mask').classList.remove('show')}
function openTaskCfg(sid){
  const s=findSubject(sid);
  openModal(`
    <h3 class="zcool">${s.name} · 任务配置</h3>
    <div class="sched-preview">可修改名称、备注、截止时间，也可以单独为每个任务设置自己的打卡周期。</div>
    ${s.tasks.map((t,i)=>`
      <div class="f-row">
        <div class="fh"><span class="fidx">${i+1}</span><input class="field" id="cf-name-${t.id}" value="${t.name}" maxlength="10" placeholder="任务名称"></div>
        <input class="field" id="cf-note-${t.id}" value="${t.note}" maxlength="30" placeholder="备注内容">
        <div class="f-2col">
          <input class="field" type="time" id="cf-time-${t.id}" value="${t.deadline}">
          <button class="addbtn" style="padding:8px" onclick="resetTask('${sid}','${t.id}')">${isDone(t,new Date())?'重置今日打卡':'今日未打卡'}</button>
        </div>
        <button class="schedrow" onclick="gotoTaskSched('${sid}','${t.id}')">
          <span class="svgi">${ICONS[schedIcon(schedOf(t).type)]}</span>
          <span class="stxt">打卡周期：${schedText(schedOf(t))}</span>
          <span class="arrow svgi">${ICONS.chevR}</span>
        </button>
      </div>`).join('')}
    <button class="addbtn" onclick="openSchedEditor('s:${sid}','${sid}')">${svgi('calCheck')} 批量设置「${s.name}」全部任务的周期</button>
    <button class="savebtn" onclick="saveTaskCfg('${sid}')">保存配置</button>`);
}
function resetTask(sid,tid){const s=findSubject(sid),t=s.tasks.find(x=>x.id===tid);setDone(t,false,new Date());save();toast('已重置为未打卡');closeModal();render()}
function collectTaskCfg(sid){
  const s=findSubject(sid);
  s.tasks.forEach(t=>{
    const n=$('#cf-name-'+t.id),o=$('#cf-note-'+t.id),d=$('#cf-time-'+t.id);
    if(n&&n.value.trim())t.name=n.value.trim();
    if(o)t.note=o.value.trim()||t.note;
    if(d&&d.value)t.deadline=d.value;
  });
  save();
}
function saveTaskCfg(sid){collectTaskCfg(sid);closeModal();toast('任务配置已保存');render()}
function gotoTaskSched(sid,tid){collectTaskCfg(sid);openSchedEditor('t:'+sid+':'+tid,sid)}

/* ---------- 周期策略编辑器 ---------- */
let schedTarget=null,schedReturn=null,editSched=null;
function openSchedEditor(target,returnSid){
  schedTarget=target;schedReturn=returnSid||null;
  let base={};
  if(String(target).startsWith('t:')){
    const p=String(target).split(':'),s=findSubject(p[1]),t=s&&s.tasks.find(x=>x.id===p[2]);
    base=schedOf(t);
  }
  editSched=Object.assign({},SCHED_DEFAULT,base);
  renderSchedEditor();
}
function schedEditorTitle(){
  if(schedTarget==='all')return '全部任务 · 周期策略';
  const p=String(schedTarget).split(':');
  if(p[0]==='s'){const s=findSubject(p[1]);return (s?s.name:'')+' · 批量周期'}
  const s=findSubject(p[1]),t=s&&s.tasks.find(x=>x.id===p[2]);
  return (t?t.name:'任务')+' · 周期策略';
}
function renderSchedEditor(){
  const sheet=document.querySelector('.sheet'),prev=sheet?sheet.scrollTop:0;
  const sc=editSched;
  let cond='';
  if(sc.type==='weekly'){
    cond=`<div class="bh">选择每周的哪几天打卡（可多选）</div>
      <div class="daysel">${WEEK_ORDER.map(i=>`<button class="${(sc.days||[]).includes(i)?'on':''}" onclick="toggleSchedDay(${i})">${WEEK_CN[i]}</button>`).join('')}</div>`;
  }else if(sc.type==='interval'){
    cond=`<div class="bh">每隔几天打卡一次</div>
      <div class="stepper"><button onclick="setSchedEvery(-1)">−</button><b>每 ${sc.every||2} 天</b><button onclick="setSchedEvery(1)">＋</button></div>
      <div class="bh">从哪一天开始算</div>
      <div class="dateline"><input type="date" value="${sc.anchor||dkey(new Date())}" onchange="setSchedField('anchor',this.value)"></div>`;
  }else if(sc.type==='monthly'){
    cond=`<div class="bh">每月几号打卡（可写多个，用逗号分隔）</div>
      <input class="field" value="${(sc.monthDays||[]).join(',')}" placeholder="例如 1,15" onchange="setMonthDays(this.value)">`;
  }else if(sc.type==='range'){
    cond=`<div class="bh">在下面「生效日期区间」里的每一天都需要打卡，适合寒暑假集训这类安排</div>`;
  }else if(sc.type==='workday'){
    cond=`<div class="bh">周一到周五打卡，周六、周日休息</div>`;
  }else if(sc.type==='weekend'){
    cond=`<div class="bh">只在周六和周日打卡</div>`;
  }else{
    cond=`<div class="bh">每天都打卡，长期适用</div>`;
  }
  openModal(`
    <h3 class="zcool">${schedEditorTitle()}</h3>
    <div class="sched-chips">
      ${SCHED_TYPES.map(x=>`<button class="sched-chip ${sc.type===x.id?'on':''}" onclick="setSchedType('${x.id}')">${svgi(x.icon)}${x.name}</button>`).join('')}
    </div>
    <div class="sched-box">${cond}</div>
    <div class="sched-box">
      <div class="bh">${sc.type==='range'?'生效日期区间（日期范围必须选择开始和结束）':'生效日期区间（留空表示长期有效）'}</div>
      <div class="dateline">
        <input type="date" value="${sc.start}" onchange="setSchedField('start',this.value)">
        <span class="sep">至</span>
        <input type="date" value="${sc.end}" onchange="setSchedField('end',this.value)">
      </div>
      <button class="addbtn" style="padding:8px" onclick="clearSchedRange()">清空区间（长期有效）</button>
    </div>
    <div class="sched-box">
      <div class="bh">快捷预设</div>
      <div class="preset-row">
        <button class="preset" onclick="applyPreset('daily')">每天都打卡</button>
        <button class="preset g" onclick="applyPreset('workday')">周一到周五</button>
        <button class="preset b" onclick="applyPreset('weekend')">只在周末</button>
        <button class="preset" onclick="applyPreset('mwf')">周一三五</button>
        <button class="preset g" onclick="applyPreset('tts')">周二四六</button>
        <button class="preset b" onclick="applyPreset('days7')">连续7天</button>
        <button class="preset" onclick="applyPreset('days21')">连续21天</button>
        <button class="preset g" onclick="applyPreset('every2')">隔天一次</button>
        <button class="preset b" onclick="applyPreset('monthly115')">每月1号15号</button>
      </div>
    </div>
    <div class="sched-preview">${schedPreview()}</div>
    <button class="savebtn" onclick="saveSched()">保存周期</button>
    <button class="addbtn" onclick="cancelSched()">取消</button>
  `);
  requestAnimationFrame(()=>{const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=prev});
}
function schedPreview(){
  const sc=Object.assign({},SCHED_DEFAULT,editSched);
  let out=`打卡周期：<b>${schedText(sc)}</b>`;
  if(sc.type==='range'&&(!sc.start||!sc.end))out+=`<br>请先选择生效日期区间的开始和结束日期`;
  else{
    const n=nextActiveDay({sched:sc},new Date());
    if(n)out+=`<br>下一个打卡日：<b>${fmtMDW(n)}</b>${isToday(n)?'（就是今天）':''}`;
    else out+=`<br>该周期已经结束，任务不会再出现在打卡列表里`;
  }
  return out;
}
function setSchedType(t){editSched.type=t;renderSchedEditor()}
function toggleSchedDay(i){
  const d=(editSched.days||[]).slice(),k=d.indexOf(i);
  if(k>=0)d.splice(k,1);else d.push(i);
  editSched.days=d.sort((a,b)=>a-b);renderSchedEditor();
}
function setSchedEvery(v){editSched.every=Math.max(1,Math.min(60,(editSched.every||2)+v));renderSchedEditor()}
function setSchedField(f,v){editSched[f]=v;renderSchedEditor()}
function clearSchedRange(){editSched.start='';editSched.end='';renderSchedEditor()}
function setMonthDays(v){
  const a=String(v).split(/[，,、\s]+/).map(x=>parseInt(x,10)).filter(x=>x>=1&&x<=31);
  editSched.monthDays=a.length?a:[1];renderSchedEditor();
}
function applyPreset(p){
  const t=dkey(new Date()),in7=dkey(addDays(new Date(),6)),in21=dkey(addDays(new Date(),20));
  const M={
    daily:{type:'daily'},workday:{type:'workday'},weekend:{type:'weekend'},
    mwf:{type:'weekly',days:[1,3,5]},tts:{type:'weekly',days:[2,4,6]},
    days7:{type:'range',start:t,end:in7},days21:{type:'range',start:t,end:in21},
    every2:{type:'interval',every:2,anchor:t},monthly115:{type:'monthly',monthDays:[1,15]}
  };
  editSched=Object.assign({},SCHED_DEFAULT,M[p]||{});
  renderSchedEditor();
}
function cancelSched(){
  if(schedReturn){const sid=schedReturn;schedReturn=null;openTaskCfg(sid)}
  else{schedTarget=null;closeModal();render()}
}
function saveSched(){
  if(editSched.type==='range'&&(!editSched.start||!editSched.end)){toast('日期范围需要同时选择开始和结束日期');return}
  if(editSched.type==='weekly'&&!(editSched.days||[]).length){toast('请至少选择一天作为打卡日');return}
  const sc=Object.assign({},SCHED_DEFAULT,editSched);
  if(schedTarget==='all'){state.subjects.forEach(s=>s.tasks.forEach(t=>t.sched=Object.assign({},sc)))}
  else{
    const p=String(schedTarget).split(':');
    if(p[0]==='s'){const s=findSubject(p[1]);if(s)s.tasks.forEach(t=>t.sched=Object.assign({},sc))}
    else{const s=findSubject(p[1]),t=s&&s.tasks.find(x=>x.id===p[2]);if(t)t.sched=Object.assign({},sc)}
  }
  save();sndClick();toast('周期已保存：'+schedText(sc));
  if(schedReturn){const sid=schedReturn;schedReturn=null;openTaskCfg(sid)}
  else{schedTarget=null;closeModal();render()}
}

/* ---------- 奖励配置弹层 ---------- */
function openRewardCfg(){
  openModal(`
    <h3 class="zcool">奖励列表管理</h3>
    ${state.rewards.map(r=>`
      <div class="f-row"><div class="f-2col">
        <input class="field" id="rw-name-${r.id}" value="${r.name}" maxlength="12" placeholder="奖励名称">
        <input class="field" type="number" id="rw-cost-${r.id}" value="${r.cost}" min="2" max="999" placeholder="积分">
      </div>
      ${r.id.startsWith('cu')?`<button class="delbtn" onclick="delReward('${r.id}')">删除这个奖励</button>`:''}
      </div>`).join('')}
    <button class="addbtn" onclick="addReward()">＋ 添加自定义奖励</button>
    <button class="savebtn" onclick="saveRewardCfg()">保存配置</button>`);
}
function addReward(){
  state.rewards.push({id:'cu'+Date.now(),name:'新奖励',cost:60,icon:'star',color:'purple'});
  save();openRewardCfg();
}
function delReward(id){state.rewards=state.rewards.filter(r=>r.id!==id);save();openRewardCfg()}
function saveRewardCfg(){
  state.rewards.forEach(r=>{
    const n=$('#rw-name-'+r.id),c=$('#rw-cost-'+r.id);
    if(n&&n.value.trim())r.name=n.value.trim();
    if(c&&parseInt(c.value)>0)r.cost=parseInt(c.value);
  });
  save();closeModal();toast('奖励配置已保存');render();
}

/* ==================== 启动 ==================== */
document.addEventListener('click',()=>{if(actx&&actx.state==='suspended')actx.resume()},{once:true});
startPetExpr();
render();
</script>
